<section class="login-wrapper">

  <div class="login-card">

    <!-- LEFT: FORM -->
    <div class="login-left">

      <div class="logo-container">
        <img src="./logo11.png" alt="WorkMax Logo" />
      </div>

      <form (ngSubmit)="onSubmit()" class="login-form">

        <h2>Sign in to WorkMax</h2>
        <p class="subtitle">Enter your details to continue</p>

        <!-- Role Selection -->
        <div class="form-group">
          <label>Select Role</label>

          <div class="radio-group">
            <label>
              <input type="radio" name="userRole" value="TEAM_LEAD"
                [(ngModel)]="selectedRole" required />
              Team Lead
            </label>

            <label>
              <input type="radio" name="userRole" value="BENCHED_EMPLOYEE"
                [(ngModel)]="selectedRole" required />
              Benched Employee
            </label>
          </div>
        </div>

        <!-- Email -->
        <div class="form-group">
          <input type="email" placeholder="Email"
            [(ngModel)]="email" name="email" required />
        </div>

        <!-- Password -->
        <div class="form-group">
          <input type="password" placeholder="Password"
            [(ngModel)]="password" name="password" required />
        </div>

        <!-- Error -->
        <div *ngIf="errorMessage" class="error-message">
          {{ errorMessage }}
        </div>

        <!-- Button -->
        <button type="submit" class="primary-btn">
          Log in
        </button>

        <!-- Forgot -->
        <p class="forgot" (click)="handleForgotPassword()">
          Forgot password?
        </p>

        <div *ngIf="showForgotPasswordMessage" class="info-box">
          Please contact your administrator to reset your password.
        </div>

        <!-- Create -->
        <div class="signup">
          <span>Don’t have an account?</span>
          <button type="button" (click)="navigateToCreateAccount()">
            Create account
          </button>
        </div>

      </form>
    </div>

    <!-- RIGHT: INFO PANEL -->
    <div class="login-right">
      <div class="right-content">
        <h3>Smarter Workforce Management</h3>
        <p>
          Optimize talent allocation, improve productivity,
          and deliver projects efficiently with WorkMax.
        </p>
      </div>
    </div>

  </div>

</section>
