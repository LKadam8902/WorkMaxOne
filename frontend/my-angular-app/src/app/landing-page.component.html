<div class="landing-wrapper">

  <!-- Wave Background -->
  <div class="wave-container">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path class="wave wave1"
        d="M0,224L80,213C160,203,320,181,480,176C640,171,800,181,960,192C1120,203,1280,213,1360,218L1440,224L1440,320L0,320Z">
      </path>

      <path class="wave wave2"
        d="M0,256L80,245C160,235,320,213,480,208C640,203,800,213,960,224C1120,235,1280,245,1360,250L1440,256L1440,320L0,320Z">
      </path>
    </svg>
  </div>

  <!-- Navbar -->
  <nav class="navbar">
    <img src="./logo11.png" alt="WorkMax Logo" class="logo" />

    <ul class="nav-links">
      <li><a href="#">Contact</a></li>
      <li><a [routerLink]="['/sign-in']">Sign in</a></li>
      <li>
        <button class="nav-btn" (click)="navigateToCreateAccount()">
          Get Started
        </button>
      </li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <h1>
      Connecting Talent to the <br />
      Right Work
    </h1>

    <p>
      A professional platform designed to optimize workforce utilization,
      streamline task allocation, and improve organizational efficiency.
    </p>

    <div class="hero-actions">
      <button class="primary-btn" (click)="navigateToCreateAccount()">
        Create Account
      </button>

      <button class="secondary-btn">
        Learn More
      </button>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    © 2025 WorkMax. All rights reserved.
  </footer>

</div>
