spring.application.name=workmaxone

server.port=${PORT:8000}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/workmaxone}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.show-sql=true
spring.jpa.hibernate.format_sql=true
spring.jpa.hibernate.highlight_sql=true

spring.jpa.hibernate.ddl-auto=update

app.admin-email=${APP_ADMIN_EMAIL:admin@workmaxone.com}
app.admin-password=${APP_ADMIN_PASSWORD:12345678}

# General logging level for your application
logging.level.com.example.workmaxone=INFO

# Optional: To see very detailed Spring Security specific logs
logging.level.org.springframework.security=WARN
